<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VivaChat</title>
<link rel="manifest" href="/manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="VivaChat">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="/icons/icon-192.png">

<meta name="theme-color" content="#f472b6">
<link rel="icon" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
:root{--pink:#f472b6;--pink-dark:#ec4899;--green:#22c55e;--bg:#fff0f6;--card:#ffffff;--text:#1f2937;--muted:#6b7280;--border:#fbcfe8}
body{background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;display:flex;flex-direction:column}
#app{flex:1;display:flex;flex-direction:column;height:100dvh}
.header{height:56px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:10px;position:sticky;top:0;z-index:10}
.header img{width:36px;height:36px;border-radius:10px;object-fit:cover}
.header h1{font-size:18px;font-weight:800;letter-spacing:-0.3px}
.header h1 span{color:var(--pink-dark)}
.header .actions{margin-left:auto;display:flex;gap:8px}
.btn{border:none;border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer;transition:.2s}
.btn-primary{background:var(--pink);color:white}
.btn-primary:hover{background:var(--pink-dark)}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-icon{width:36px;height:36px;border-radius:10px;background:#fdf2f8;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);cursor:pointer}
.screen{display:none;flex:1;overflow:hidden}
.screen.active{display:flex;flex-direction:column}
.auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#fff0f6,#fce7f3)}
.card{background:white;border-radius:20px;padding:24px;width:100%;max-width:380px;box-shadow:0 10px 30px rgba(244,114,182,.15);border:1px solid var(--border)}
.logo-big{width:86px;height:86px;margin:0 auto 12px;display:block;border-radius:20px;object-fit:cover}
.card h2{text-align:center;font-size:22px;margin-bottom:6px}
.card p{text-align:center;color:var(--muted);font-size:13px;margin-bottom:18px}
.input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;font-size:15px;outline:none}
.input:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(244,114,182,.2)}
.row{display:flex;gap:8px}
.main-layout{flex:1;display:flex;overflow:hidden}
.sidebar{width:100%;max-width:380px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column}
@media(min-width:800px){.sidebar{width:360px}}
.tabs{display:flex;padding:8px;gap:6px;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:8px;border-radius:10px;border:none;background:#fdf2f8;font-size:13px;font-weight:600;cursor:pointer}
.tab.active{background:var(--pink);color:white}
.search-box{padding:10px;border-bottom:1px solid var(--border)}
.list{flex:1;overflow-y:auto}
.item{display:flex;gap:10px;padding:12px;border-bottom:1px solid #fdf2f3;cursor:pointer;align-items:center}
.item:hover{background:#fff5f9}
.item.active{background:#fce7f3}
.avatar{width:42px;height:42px;border-radius:14px;background:#fbcfe8;object-fit:cover;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--pink-dark);flex-shrink:0}
.dot{width:8px;height:8px;border-radius:50%;background:#d1d5db;position:absolute;bottom:0;right:0;border:2px solid white}
.dot.online{background:var(--green)}
.item-info{flex:1;min-width:0}
.item-info b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-info small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.chat-area{flex:1;display:flex;flex-direction:column;background:#fff7fb;position:relative}
.chat-header{height:56px;background:white;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:10px}
.messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:78%;padding:10px 12px;border-radius:18px;font-size:14px;line-height:1.35;position:relative;word-break:break-word}
.bubble.me{align-self:flex-end;background:var(--pink);color:white;border-bottom-right-radius:6px}
.bubble.other{align-self:flex-start;background:white;border:1px solid var(--border);border-bottom-left-radius:6px}
.bubble img{max-width:200px;border-radius:12px;display:block;margin-top:6px}
.meta{font-size:10px;opacity:.7;margin-top:4px}
.composer{padding:10px;background:white;border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end}
.composer input[type=text]{flex:1;padding:12px 14px;border:1px solid var(--border);border-radius:24px;outline:none;font-size:15px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:none;background:#fdf2f8;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
.icon-btn.primary{background:var(--pink);color:white}
.typing{font-size:12px;color:var(--green);padding:4px 12px}
.status-bar{display:flex;gap:10px;padding:10px;overflow-x:auto;border-bottom:1px solid var(--border);background:white}
.status-item{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:56px;cursor:pointer}
.status-ring{width:52px;height:52px;border-radius:50%;padding:2px;background:linear-gradient(45deg,var(--pink),var(--green))}
.status-ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid white;background:white}
.notif{position:fixed;top:70px;right:10px;background:#1f2937;color:white;padding:10px 14px;border-radius:12px;font-size:13px;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);padding:20px;text-align:center}
.empty img{width:90px;opacity:.8;margin-bottom:12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.active{display:flex}
.modal-card{background:white;border-radius:18px;padding:18px;width:100%;max-width:360px;max-height:90dvh;overflow:auto}
.call-bar{background:#111827;color:white;padding:10px;display:flex;align-items:center;gap:10px;justify-content:space-between}
video{width:100%;border-radius:12px;background:black}
.badge{background:var(--green);color:white;font-size:10px;padding:2px 6px;border-radius:10px;margin-left:6px}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <img src="/logo.png" alt="VivaChat">
    <h1>Viva<span>Chat</span></h1>
    <div class="actions" id="headerActions"><button id="installBtn" onclick="installPWA()" style="display:none;background:var(--green);color:white;border:none;padding:6px 12px;border-radius:10px;font-size:12px;font-weight:700">📲 Instalar</button></div>
  </div>

  <!-- AUTH -->
  <div id="authScreen" class="screen active">
    <div class="auth-wrap">
      <div class="card" id="authCard"></div>
    </div>
  </div>

  <!-- MAIN -->
  <div id="mainScreen" class="screen">
    <div class="main-layout">
      <div class="sidebar" id="sidebar">
        <div class="tabs">
          <button class="tab active" data-tab="chats">Chats</button>
          <button class="tab" data-tab="groups">Grupos</button>
          <button class="tab" data-tab="users">Personas</button>
          <button class="tab" data-tab="status">Estados</button>
        </div>
        <div class="status-bar" id="statusBar" style="display:none"></div>
        <div class="search-box">
          <input id="searchInput" class="input" style="margin:0" placeholder="Buscar usuarios...">
        </div>
        <div class="list" id="listView"></div>
        <div style="padding:10px;border-top:1px solid var(--border);display:flex;gap:8px">
          <button class="btn btn-primary" style="flex:1" onclick="openGroupModal()">+ Grupo</button>
          <button class="btn btn-ghost" onclick="openProfile()">Perfil</button>
          <button class="btn btn-ghost" onclick="logout()">Salir</button>
        </div>
      </div>
      <div class="chat-area" id="chatArea">
        <div class="empty" id="emptyChat">
          <img src="/logo.png">
          <h3>Bienvenido a VivaChat</h3>
          <p>Selecciona un chat para empezar a conversar. Todo es tiempo real y privado.</p>
          <small style="margin-top:8px;color:var(--pink-dark)">PWA instalable • Archivos • Voz • Grupos • Estados 24h</small>
        </div>
        <div id="activeChat" style="display:none;flex:1;flex-direction:column;overflow:hidden">
          <div class="chat-header" id="chatHeader"></div>
          <div class="messages" id="messages"></div>
          <div class="typing" id="typingIndicator"></div>
          <div class="composer">
            <label class="icon-btn"><input type="file" id="fileInput" hidden>📎</label>
            <button class="icon-btn" id="voiceBtn" title="Nota de voz">🎙️</button>
            <input type="text" id="messageInput" placeholder="Escribe un mensaje..." autocomplete="off">
            <button class="icon-btn primary" onclick="sendMessage()">✈️</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="profileModal"><div class="modal-card" id="profileCard"></div></div>
<div class="modal" id="groupModal"><div class="modal-card" id="groupCard"></div></div>
<div class="modal" id="statusModal"><div class="modal-card" id="statusViewCard"></div></div>
<div class="modal" id="callModal"><div class="modal-card" id="callCard"></div></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>
</body>
</html>
